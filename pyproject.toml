[project]
name = "m5food"
version = "0.1.0"
description = "Sales forecasting research on the M5 FOODS category, 10 stores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "matplotlib",
    "statsmodels",
    "ipykernel",
    "nbstripout",
    "plotly>=7.1.0",
    "statsforecast>=2.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/m5food"]
